use_default_settings:
  engines:
    keep_only:
      - bing
      - mojeek
      - mwmbl

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "relay-local-search-only"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

engines:
  - name: bing
    engine: bing
    disabled: false
  - name: mojeek
    engine: mojeek
    disabled: false
  - name: mwmbl
    engine: mwmbl
    disabled: false
